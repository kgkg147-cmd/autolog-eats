<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTOLOG · Seomyeon Local Eats</title>
<meta name="description" content="10 local spots near AUTOLOG in Seomyeon, Busan, picked by a Busan local.">
<meta name="theme-color" content="#c41e1a">
<style>
  :root{
    --bg:#f6efe3; --card:#fffaf1; --ink:#2a1d1a; --sub:#6b5a52;
    --brand:#c41e1a; --brand-ink:#fff; --line:#e4d7c3; --chip:#efe2cc;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif;
    line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  .logo{display:block;width:100%;height:auto;border-radius:14px;margin:4px 0 16px}

  .review{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:20px 18px;text-align:center}
  .review h1{font-size:19px;line-height:1.35;margin:0 0 6px}
  .review p{margin:0 0 14px;font-size:14px;opacity:.92}
  .btn-review{display:block;background:#fff;color:var(--brand);font-weight:800;text-decoration:none;
    padding:14px 16px;border-radius:12px;font-size:16px}
  .btn-review:active{transform:scale(.98)}

  .langs{display:flex;gap:8px;margin:22px 0 14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  .langs button{flex:1;padding:11px 6px;border-radius:999px;border:1.5px solid var(--brand);
    background:transparent;color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .langs button[aria-pressed="true"]{background:var(--brand);color:#fff}

  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--sub);margin-bottom:16px}
  .intro b{color:var(--ink)}

  .list{display:grid;gap:12px;margin:0;padding:0;list-style:none}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .top{display:flex;gap:10px;align-items:flex-start}
  .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:2px}
  .ko{font-size:19px;font-weight:800;margin:0;line-height:1.3}
  .en{font-size:13px;color:var(--sub);margin:1px 0 0}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
  .tag{background:var(--chip);color:#5b3a2a;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600}
  .tag.near{background:#f3d6d2;color:var(--brand)}
  .desc{margin:0 0 10px;font-size:14.5px}
  .addr{font-size:12.5px;color:var(--sub);margin:0 0 12px}
  .btn-map{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;
    padding:11px 12px;border-radius:10px;border:1.5px solid var(--brand);color:var(--brand)}
  .btn-map:active{background:var(--chip)}
  .btns{display:grid;gap:8px}
  .btn-map.alt{border-color:var(--line);color:var(--sub);font-weight:600;font-size:13px}

  .note{margin-top:20px;font-size:13px;color:var(--sub);text-align:center}
  .bottom-review{margin-top:22px}
  footer{margin-top:26px;text-align:center;font-size:12px;color:var(--sub)}
</style>
</head>
<body>

  <img class="logo" src="logo.png" alt="AUTOLOG Automatic Photo Machine" width="900" height="203">

  <section class="review">

    <p id="rv-sub"></p>
    <a class="btn-review" id="rv-btn" href="https://g.page/r/CQ_erVOH3y5NEBM/review" target="_blank" rel="noopener"></a>

  <div class="langs" role="group" aria-label="Language">

    <button data-lang="ja">日本語</button>

  <ol class="list" id="list"></ol>
  <p class="note" id="note"></p>

  <a class="btn-review bottom-review" style="background:var(--brand);color:#fff" id="rv-btn2" href="https://g.page/r/CQ_erVOH3y5NEBM/review" target="_blank" rel="noopener"></a>
  <footer>© AUTOLOG</footer>
</div>

  { ko:"뎐벼락막창", en:"Dyeonbyeorak Makchang", url:"https://naver.me/5huaeiFR", addr:"부산진구 부전동 168-50", enAddr:"168-50 Bujeon-dong, Busanjin-gu, Busan",

  { ko:"가로수 그늘아래", en:"Garosu Geuneul-arae", url:"https://naver.me/5Ne3TOBK", addr:"부산진구 부전동 168-320", enAddr:"168-320 Bujeon-dong, Busanjin-gu, Busan",

let lang = "en";
const $ = id => document.getElementById(id);

function render(){
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  $("rv-title").textContent = t.rvTitle;
  $("rv-sub").textContent = t.rvSub;
  $("rv-btn").textContent = t.rvBtn;
  $("rv-btn2").textContent = t.rvBtn;
  $("intro").innerHTML = t.intro;
  $("note").textContent = t.note;
  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));

  $("list").innerHTML = PLACES.map((p, i) => {
    const href = p.url || NAVER(p.q);
    const near = p.near ? `<span class="tag near">${p.near===1 ? t.near1 : t.near2}</span>` : "";
    const tags = p.tags[lang].map(x => `<span class="tag">${x}</span>`).join("");
    return `<li class="item">
      <div class="top"><div class="num">${i+1}</div>
        <div><h2 class="ko">${p.ko}</h2><p class="en">${p.en}</p></div></div>
      <div class="tags">${near}${tags}</div>
      <p class="desc">${p.d[lang]}</p>
      ${p.addr ? `<p class="addr">📍 ${p.enAddr}<br><span lang="ko">${p.addr}</span></p>` : ""}
      <div class="btns">
        <a class="btn-map" href="${href}" target="_blank" rel="noopener">${t.map}</a>
        ${p.addr ? `<a class="btn-map alt" href="${GMAP(p)}" target="_blank" rel="noopener">${t.gmap}</a>` : ""}
      </div>
    </li>`;
  }).join("");
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try{ localStorage.setItem("autolog-lang", lang); }catch(e){}
    render();
  }));

(function init(){
  let saved = null;
  try{ saved = localStorage.getItem("autolog-lang"); }catch(e){}
  if(saved && UI[saved]) lang = saved;
  else {
    const n = (navigator.language || "en").toLowerCase();
    lang = n.startsWith("ja") ? "ja" : n.startsWith("zh") ? "zh" : "en";
  }
  render();
})();
</script>
</body>
</html>
